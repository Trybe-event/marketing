name: marketing
on:
  pull_request:
  push:
    branches: [main, stable]
jobs:
  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npm run build
  motion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
